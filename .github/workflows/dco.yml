name: DCO

on:
  pull_request:

# Least privilege for every job. Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every non-merge commit in the PR needs a Signed-off-by trailer
      # (`git commit -s`). No third-party app is involved.
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <[^<>]+@[^<>]+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line. Run: git rebase --signoff $BASE"
              status=1
            fi
          done
          exit $status
