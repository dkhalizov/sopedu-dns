name: Crate

# Publishes the crate to crates.io when the maintainer publishes a GitHub
# Release. The job runs in the `crates-io` environment, which waits for a
# maintainer's approval and accepts only v* tags. Authentication is crates.io
# trusted publishing (OIDC, no stored token); a CARGO_REGISTRY_TOKEN secret in
# that environment is used instead when present, for the first release before
# trusted publishing can be configured.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Tag must match the crate version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }
      - name: Stored token?
        id: stored
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Trusted publishing token
        id: oidc
        if: steps.stored.outputs.present == 'false'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.oidc.outputs.token }}
        run: cargo publish --locked
