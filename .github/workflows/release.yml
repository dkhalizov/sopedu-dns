name: Release

# Runs only when a version tag is pushed, never on normal pushes. It builds
# static musl binaries with generated third-party licence notices, a SHA-256
# checksum file and a CycloneDX SBOM, then creates a DRAFT GitHub Release for
# the maintainer to review and publish by hand. Publishing it triggers
# image.yml (container image) and crates.yml (crates.io, after approval).
on:
  push:
    tags: ['v*']

# Least privilege; only the final job gets contents: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Tag must match the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match Cargo.toml version $version" >&2; exit 1; }
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          # Native builds on each architecture; musl-gcc compiles the C parts of ring.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary is static and runs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/sopedu-dns"
          file "$bin"
          file "$bin" | grep -qE 'statically linked|static-pie linked'
          "$bin" --version
      - name: Third-party licence notices
        run: |
          cargo install cargo-about --locked --version 0.9.3
          cargo about generate --locked --fail about.hbs > THIRD-PARTY-LICENSES.html
          test -s THIRD-PARTY-LICENSES.html
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="sopedu-dns-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/sopedu-dns" LICENSE-APACHE LICENSE-MIT THIRD-PARTY-LICENSES.html README.md CHANGELOG.md config.example.toml "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: sopedu-dns-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: CycloneDX SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.9
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sbom
          mv sbom.json "sopedu-dns-$TAG.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sopedu-dns-*.cdx.json
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance with Sigstore (keyless)
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum sopedu-dns-* > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sopedu-dns-*.tar.gz
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: cp "$BUNDLE" "dist/sopedu-dns-$TAG.intoto.jsonl"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag $flags \
            --title "$TAG" --notes "Draft. Copy the $TAG section of CHANGELOG.md here before publishing. Verify downloads with SHA256SUMS, and their build provenance with: gh attestation verify <file> --repo $REPO"
