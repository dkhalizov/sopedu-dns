apiVersion: v1
kind: Pod
metadata:
  name: bench-blocky
spec:
  nodeName: NODE_NAME
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
    - name: blocky
      image: ghcr.io/0xerr0r/blocky:v0.35.0
      env:
        - name: SSL_CERT_FILE
          value: /tls/ca.pem
      resources:
        requests:
          cpu: "1"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: config
          mountPath: /app/config.yml
          readOnly: true
  volumes:
    - name: config
      hostPath:
        path: /tmp/sopedu-bench/blocky/config.yml
        type: File
    - name: tls
      hostPath:
        path: /tmp/sopedu-bench/tls
        type: Directory
