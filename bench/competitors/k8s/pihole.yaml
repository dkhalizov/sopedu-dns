apiVersion: v1
kind: Pod
metadata:
  name: bench-pihole
spec:
  nodeName: NODE_NAME
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
    - name: pihole
      image: pihole/pihole:2026.10.1
      env:
        - name: TZ
          value: UTC
        - name: FTLCONF_dns_upstreams
          value: "UPSTREAM_IP#5300"
        - name: FTLCONF_dns_port
          value: "15353"
        - name: FTLCONF_dns_listeningMode
          value: all
        - name: FTLCONF_dns_blocking_active
          value: "true"
        - name: FTLCONF_dns_cache_size
          value: "10000"
        - name: FTLCONF_dns_rateLimit_count
          value: "0"
        - name: FTLCONF_webserver_api_password
          value: bench
      resources:
        requests:
          cpu: "1"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: etc
          mountPath: /etc/pihole
  volumes:
    - name: etc
      emptyDir: {}
