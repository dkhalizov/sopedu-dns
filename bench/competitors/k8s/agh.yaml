apiVersion: v1
kind: Pod
metadata:
  name: bench-agh
spec:
  nodeName: NODE_NAME
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
    - name: agh
      image: adguard/adguardhome:v0.107.79
      env:
        - name: SSL_CERT_FILE
          value: /tls/ca.pem
      resources:
        requests:
          cpu: "1"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: conf
          mountPath: /opt/adguardhome/conf
        - name: work
          mountPath: /opt/adguardhome/work
  volumes:
    - name: conf
      hostPath:
        path: /tmp/sopedu-bench/agh
        type: Directory
    - name: work
      emptyDir: {}
    - name: tls
      hostPath:
        path: /tmp/sopedu-bench/tls
        type: Directory
