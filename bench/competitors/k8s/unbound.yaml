apiVersion: v1
kind: Pod
metadata:
  name: bench-unbound
spec:
  nodeName: NODE_NAME
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
    - name: unbound
      image: ref-bench:amd64
      imagePullPolicy: Never
      command: ["unbound", "-d", "-c", "/etc/ref/unbound.conf"]
      resources:
        requests:
          cpu: "1"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: conf
          mountPath: /etc/ref
          readOnly: true
  volumes:
    - name: conf
      hostPath:
        path: /tmp/sopedu-bench/unbound
        type: Directory
