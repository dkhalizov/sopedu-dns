# Reference forwarder: plain dnsmasq, cache on, no blocklists, no query log,
# every query forwarded to the shared mock upstream (@PLAINHASH@ = ip#port).
# dnsmasq caps cache-size at 10000 entries: the whole 12.7k-name corpus does not
# fit (the unblocked 9k-name subset does). Pi-hole's FTL embeds dnsmasq.
port=@PORT@
no-resolv
no-hosts
no-daemon
user=root
server=@PLAINHASH@
cache-size=20000
