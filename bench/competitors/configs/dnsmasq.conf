# Reference forwarder: plain dnsmasq, cache on, no blocklists, no query log,
# every query forwarded to the shared mock upstream (@PLAINHASH@ = ip#port).
# cache-size 20000 holds the whole 12.7k-name corpus (2.91 starts with
# "cachesize 20000" and warns that over 10000 is unlikely to be useful).
# HTTPS records are not cached: that needs --cache-rr (2.90+), not set here.
# Pi-hole's FTL embeds dnsmasq.
port=@PORT@
no-resolv
no-hosts
no-daemon
user=root
server=@PLAINHASH@
cache-size=20000
