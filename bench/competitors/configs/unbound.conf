# Reference forwarder: one thread, cache on, no blocking, no DNSSEC, every
# query forwarded to the shared mock upstream (@PLAINAT@ = ip@port).
# Cache sizes are well above the 12.7k-name hot set (the 4 MiB default is not).
server:
  chroot: ""
  username: ""
  pidfile: ""
  directory: "/tmp"
  verbosity: 0
  use-syslog: no
  interface: 0.0.0.0
  port: @PORT@
  num-threads: 1
  so-reuseport: no
  access-control: 0.0.0.0/0 allow
  msg-cache-size: 64m
  rrset-cache-size: 128m
  ratelimit: 0
  ip-ratelimit: 0
  do-ip6: no
  module-config: "iterator"
  hide-identity: yes
  hide-version: yes

forward-zone:
  name: "."
  forward-addr: @PLAINAT@
